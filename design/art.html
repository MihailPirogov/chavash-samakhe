<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#c{position:relative;overflow:hidden;font-family:"Nunito","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:#fff}
#c .bg{position:absolute;inset:0;background-size:cover;background-position:center}
#c .sh{position:absolute;inset:0}
#c .band{position:absolute;left:0;right:0;background-repeat:repeat-x}
.t{position:absolute;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 #8e1622,0 8px 24px rgba(0,0,0,.6)}
.s{position:absolute;font-weight:800;color:#f3cf6a;text-shadow:0 2px 8px rgba(0,0,0,.75)}
.ic{position:absolute;border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.grid{position:absolute;display:grid;gap:6px;padding:12px;border-radius:18px;background:rgba(31,21,23,.5);backdrop-filter:blur(8px)}
.cl{display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:12px}
.cl.f{background:linear-gradient(180deg,#b8202f,#d0303a 50%,#8e1622);color:#fffaf0;text-shadow:0 2px 2px rgba(0,0,0,.35)}
.cl.e{background:rgba(251,241,220,.94);box-shadow:inset 0 0 0 2px #e9b949}
.cl.n{background:transparent}
</style><script src="../js/art.js"></script></head><body><div id="c"></div><script>
// crossword: СӐМАХ / МӐЙ (Chuvash words: «слово», «шея»)
function grid(x,y,cell,font){
 const rows=[['С','Ӑ','М','А','Х'],['','','Ӑ','',''],['','','Й','','']];
 const st=[['f','f','f','f','f'],['n','n','f','n','n'],['n','n','e','n','n']];
 let h=`<div class="grid" style="left:${x}px;top:${y}px;grid-template-columns:repeat(5,${cell}px);grid-auto-rows:${cell}px">`;
 rows.forEach((r,i)=>r.forEach((ch,j)=>{const s=st[i][j];h+=`<div class="cl ${s}" style="font-size:${font}px">${s==='f'?ch:''}</div>`}));
 return h+'</div>';
}
const band=(h,top)=>`<div class="band" style='${top?'top:0':'bottom:0'};height:${h}px;background-image:${Art.band('#b8202f','#e9b949','#1f1517')};background-size:${h*3.2}px ${h}px'></div>`;
const SH='rgba(31,10,12,';
function render(k){
 const c=document.getElementById('c');
 const T='Чӑваш сӑмахӗ', BG='../img/bg/ch12_l.webp';
 if(k==='feature'){ c.style.width='1024px';c.style.height='500px';
  c.innerHTML=`<div class="bg" style="background-image:url(${BG})"></div>
  <div class="sh" style="background:linear-gradient(90deg,${SH}.85) 0,${SH}.55) 48%,${SH}0) 78%)"></div>${band(22,1)}${band(22,0)}
  <img class="ic" src="../img/icon.png" style="left:56px;top:62px;width:150px;height:150px">
  <div class="t" style="left:56px;top:232px;font-size:72px">${T}</div>
  <div class="s" style="left:58px;top:334px;font-size:30px">Чувашское слово</div>
  <div class="s" style="left:58px;top:380px;font-size:24px;color:#fff">Игра в слова на чувашском языке</div>
  ${grid(640,150,66,40)}`; return [1024,500]; }
 if(k==='cover'){ c.style.width='800px';c.style.height='470px';
  c.innerHTML=`<div class="bg" style="background-image:url(${BG})"></div>
  <div class="sh" style="background:linear-gradient(180deg,${SH}.15),${SH}.8))"></div>${band(18,0)}
  <img class="ic" src="../img/icon.png" style="left:330px;top:36px;width:140px;height:140px">
  <div class="t" style="left:0;right:0;text-align:center;top:198px;font-size:68px">${T}</div>
  <div class="s" style="left:0;right:0;text-align:center;top:295px;font-size:28px">Чувашское слово</div>
  <div class="s" style="left:0;right:0;text-align:center;top:340px;font-size:24px;color:#fff">Собирайте слова из букв · 700 уровней</div>`; return [800,470]; }
 if(k==='banner'){ c.style.width='1920px';c.style.height='1080px';
  c.innerHTML=`<div class="bg" style="background-image:url(${BG})"></div>
  <div class="sh" style="background:linear-gradient(90deg,${SH}.85) 0,${SH}.5) 48%,${SH}0) 78%)"></div>${band(40,1)}${band(40,0)}
  <img class="ic" src="../img/icon.png" style="left:120px;top:160px;width:300px;height:300px">
  <div class="t" style="left:120px;top:500px;font-size:140px">${T}</div>
  <div class="s" style="left:124px;top:705px;font-size:60px">Чувашское слово</div>
  <div class="s" style="left:124px;top:795px;font-size:46px;color:#fff">Игра в слова на чувашском языке</div>
  ${grid(1180,330,130,80)}`; return [1920,1080]; }
}
</script></body></html>
